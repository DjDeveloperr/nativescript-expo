name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  ios-build:
    name: iOS Simulator Build and E2E
    runs-on: macos-15
    timeout-minutes: 60
    needs: test
    env:
      RCT_NO_LAUNCH_PACKAGER: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode 26 when available
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Build iOS app
        run: npm run build:ios:ci

      - name: Run SimDeck E2E
        run: |
          set -euo pipefail

          metro_log="$RUNNER_TEMP/metro.log"
          npm run start -- --port 8081 --host localhost >"$metro_log" 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" >/dev/null 2>&1 || true' EXIT

          bundle_url="http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&minify=false"
          for _ in {1..60}; do
            if curl -fsS "$bundle_url" >/dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS "$bundle_url" >/dev/null; then
            cat "$metro_log"
            exit 1
          fi

          app_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphonesimulator/NativeScriptRN.app" \
            -print -quit)"

          if [ -z "$app_path" ]; then
            echo "Unable to locate NativeScriptRN.app"
            find "$HOME/Library/Developer/Xcode/DerivedData" -path "*NativeScriptRN.app" -print
            exit 1
          fi

          simulator_udid="$(
            xcrun simctl list devices available --json | node -e '
              const fs = require("node:fs");
              const payload = JSON.parse(fs.readFileSync(0, "utf8"));
              const devices = Object.values(payload.devices || {}).flat()
                .filter((device) => device.isAvailable && /^iPhone\b/.test(device.name));
              const selected =
                devices.find((device) => device.state === "Booted") ||
                devices.find((device) => /iPhone 17/.test(device.name)) ||
                devices[0];
              if (!selected) {
                process.exit(1);
              }
              process.stdout.write(selected.udid);
            '
          )"

          if [ -z "$simulator_udid" ]; then
            echo "Unable to locate an available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator $simulator_udid"
          xcrun simctl boot "$simulator_udid" || true

          SIMDECK_UDID="$simulator_udid" \
            E2E_APP_PATH="$app_path" \
            E2E_TIMEOUT_MS=240000 \
            npm run test:e2e
