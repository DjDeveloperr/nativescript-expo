name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  ios-build:
    name: iOS Simulator Build and E2E
    runs-on: macos-15
    timeout-minutes: 60
    needs: test
    env:
      RCT_NO_LAUNCH_PACKAGER: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode 26 when available
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Build iOS app
        run: |
          IOS_CONFIGURATION=Release \
            IOS_SIMULATOR_UDID_FILE="$RUNNER_TEMP/ios-simulator-udid" \
            npm run build:ios:ci

      - name: Run SimDeck E2E
        timeout-minutes: 12
        run: |
          set -euo pipefail

          simulator_udid="$(cat "$RUNNER_TEMP/ios-simulator-udid")"
          echo "Testing on simulator $simulator_udid"

          app_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Release-iphonesimulator/NativeScriptRN.app" \
            -print -quit)"

          if [ -z "$app_path" ]; then
            echo "Unable to locate NativeScriptRN.app"
            find "$HOME/Library/Developer/Xcode/DerivedData" -path "*NativeScriptRN.app" -print
            exit 1
          fi

          E2E_APP_PATH="$app_path" \
            E2E_TIMEOUT_MS=360000 \
            SIMDECK_SHARED_SERVICE=1 \
            SIMDECK_UDID="$simulator_udid" \
            npm run test:e2e
